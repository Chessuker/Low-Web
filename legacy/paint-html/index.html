<!doctype html>
<meta charset=utf-8>
<title>C Paint</title>
<style>
  html, body { margin: 0; height: 100%; background: #2b2b2e; display: grid; place-items: center; }
  canvas { max-width: 100vw; max-height: 100vh; touch-action: none; }
</style>
<canvas id=c></canvas>
<input id=f type=file accept="image/*" hidden>
<script type=module>
// Bootloader only: forward input to C, blit its framebuffer, do the I/O C can't.
let memory;
const env = {
  js_save(ptr, len) {
    const url = URL.createObjectURL(new Blob([new Uint8Array(memory.buffer, ptr, len)], { type: 'image/png' }));
    Object.assign(document.createElement('a'), { href: url, download: 'drawing.png' }).click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  },
  js_open() { f.click(); },
};
const { instance } = await WebAssembly.instantiateStreaming(fetch('paint.wasm'), { env });
const x = instance.exports;
memory = x.memory;
x.init();
c.width = x.width(); c.height = x.height();
const ctx = c.getContext('2d'), img = ctx.createImageData(c.width, c.height);

const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
const CURSOR = ['default', 'pointer', 'none', 'crosshair'];
c.onpointerdown = e => { c.setPointerCapture(e.pointerId); x.pointer_down(...pos(e), e.button); };
c.onpointermove = e => { for (const ev of e.getCoalescedEvents?.() ?? [e]) c.style.cursor = CURSOR[x.pointer_move(...pos(ev))]; };
c.onpointerup = c.onpointercancel = () => x.pointer_up();
c.onpointerleave = () => x.pointer_leave();
c.oncontextmenu = e => e.preventDefault();
onkeydown = e => { if (e.key.length === 1 && x.key(e.key.charCodeAt(0), e.ctrlKey || e.metaKey)) e.preventDefault(); };

// The browser decodes PNG/JPEG/…; C scales and places the pixels.
async function load(file) {
  if (!file) return;
  try {
    const bmp = await createImageBitmap(file);
    const g = new OffscreenCanvas(bmp.width, bmp.height).getContext('2d');
    g.drawImage(bmp, 0, 0);
    const { data } = g.getImageData(0, 0, bmp.width, bmp.height);
    const p = x.alloc(data.length);
    if (!p) throw new Error('image too large');
    new Uint8Array(memory.buffer, p, data.length).set(data);
    x.import_image(p, bmp.width, bmp.height);
  } catch (err) { alert(`Couldn't open ${file.name}: ${err.message}`); }
}
f.onchange = () => { load(f.files[0]); f.value = ''; };
ondragover = e => e.preventDefault();
ondrop = e => { e.preventDefault(); load(e.dataTransfer.files[0]); };

(function loop() {
  const p = x.render();
  if (p) { img.data.set(new Uint8Array(memory.buffer, p, img.data.length)); ctx.putImageData(img, 0, 0); }
  requestAnimationFrame(loop);
})();
</script>
